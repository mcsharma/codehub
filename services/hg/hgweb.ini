[paths]
/ = /data/repos/**

[web]
push_ssl = false
allow_push = *

# Keep pushed changesets draft so authors can still amend/rebase them
# locally after `ch submit` — a publishing server would mark them public on
# arrival, and public changesets are supposed to be treated as immutable.
[phases]
publish = False

[hooks]
prepushkey.protect_bookmarks = python:/opt/hgservice/hg_hooks.py:reject_unsafe_bookmark_push

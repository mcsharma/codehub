server {
    server_name hg.greensnippet.com;

    location / {
        auth_request /internal/auth-check;
        error_page 401 = @auth_denied;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only: proxies the auth check to the BFF (Railway), passing along
    # the original request's path so it can resolve {owner}/{repo} and the
    # wire-protocol `cmd` (read vs write is classified from `cmd`, not HTTP
    # method — see the comment in web/bff/src/index.ts). The original
    # Authorization header rides along automatically — auth_request subrequests
    # carry the parent request's headers by default.
    location = /internal/auth-check {
        internal;
        proxy_pass https://www.greensnippet.com/internal/auth-check;
        # auth_request subrequests mirror the original request's HTTP method by
        # default (so a push's POST would hit this as a POST too) — force GET
        # since the BFF only registers this route for GET and the body is
        # discarded either way.
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # nginx doesn't forward the subrequest's own response headers on a 401, so
    # WWW-Authenticate has to be re-added here for hg/git clients to prompt
    # for credentials correctly.
    location @auth_denied {
        add_header WWW-Authenticate 'Basic realm="hg access"' always;
        return 401;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hg.greensnippet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hg.greensnippet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = hg.greensnippet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hg.greensnippet.com;
    return 404; # managed by Certbot
}

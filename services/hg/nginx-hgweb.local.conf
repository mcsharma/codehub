# Local-dev equivalent of nginx-hgweb.conf (see README.md). Same
# auth_request/@auth_denied machinery as prod, pointed at local targets:
# hgweb-app is the compose service name instead of 127.0.0.1, and the
# auth-check subrequest goes to the host's locally-running BFF via
# host.docker.internal instead of the prod domain. TLS/certbot are
# dropped — loopback-only, nothing to issue a cert for.
server {
    listen 8000;
    server_name localhost;

    location / {
        auth_request /internal/auth-check;
        error_page 401 = @auth_denied;

        proxy_pass http://hgweb-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # See nginx-hgweb.conf for why this proxies to the BFF's
    # /internal/auth-check rather than checking auth here directly.
    #
    # host.docker.internal resolves to both an IPv4 and an IPv6 address on
    # Docker Desktop, and the IPv6 one isn't actually reachable from inside
    # this container — hit as "connect() to [fd..]:4000 failed (101:
    # Network unreachable)" plus nginx's passive health check then marking
    # the (statically-resolved, single) upstream "temporarily disabled" for
    # its fail_timeout window, which cascades into every request of a push
    # that lands in that window (a push's listkeys/unbundle calls all fire
    # within milliseconds of each other, well inside it) — surfacing to hg
    # as a flat, repeatable "http authorization required" with nothing ever
    # reaching the BFF. `resolver ... ipv6=off` + a variable forces nginx to
    # re-resolve through Docker's embedded DNS on each request rather than
    # caching one address (IPv6 included) at config load.
    resolver 127.0.0.11 ipv6=off valid=30s;

    location = /internal/auth-check {
        internal;
        set $bff_host host.docker.internal;
        proxy_pass http://$bff_host:4000/internal/auth-check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # nginx doesn't forward the subrequest's own response headers on a 401, so
    # WWW-Authenticate has to be re-added here for hg/git clients to prompt
    # for credentials correctly.
    location @auth_denied {
        add_header WWW-Authenticate 'Basic realm="hg access"' always;
        return 401;
    }
}

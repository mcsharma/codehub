# Deployed on the DO VM as: docker compose -p codehub-prod -f docker-compose.prod.yml --env-file .env.prod up -d
# See ../README.md for the full picture (prod vs test, deploy.sh, worker auth).
services:
  hgweb-app:
    build:
      context: ..
      dockerfile: Dockerfile.local
    volumes:
      - ../hgweb_wsgi.py:/opt/hgservice/hgweb_wsgi.py:ro
      - ../hgweb.ini:/etc/hgweb.ini:ro
      - ../hg_hooks.py:/opt/hgservice/hg_hooks.py:ro
      - /data/repos-prod:/data/repos
    restart: unless-stopped

  hgweb-proxy:
    image: nginx:alpine
    depends_on:
      - hgweb-app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  worker:
    build:
      context: ../worker
    environment:
      HG_WORKER_REPOS_DIR: /data/repos
      BFF_GRAPHQL_URL: https://www.greensnippet.com/graphql
      HG_WORKER_TOKEN: ${HG_WORKER_TOKEN}
    volumes:
      - /data/repos-prod:/data/repos
    restart: unless-stopped

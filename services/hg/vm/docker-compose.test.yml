# Deployed on the DO VM as: docker compose -p codehub-test -f docker-compose.test.yml --env-file .env.test up -d
# This is what "local dev" now points at instead of running hgweb/db
# containers on the laptop — see ../README.md.
services:
  hgweb-app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../hgweb_wsgi.py:/opt/hgservice/hgweb_wsgi.py:ro
      - ../hgweb.ini:/etc/hgweb.ini:ro
      - ../hg_hooks.py:/opt/hgservice/hg_hooks.py:ro
      - /data/repos-test:/data/repos
    restart: unless-stopped

  hgweb-proxy:
    image: nginx:alpine
    depends_on:
      - hgweb-app
    ports:
      - '8001:8001'
    environment:
      # Substituted into nginx-test.conf.template at container start — see
      # that file's header comment. The test BFF's Railway-generated domain.
      BFF_TEST_DOMAIN: ${BFF_TEST_DOMAIN}
    volumes:
      - ./nginx-test.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

  worker:
    build:
      context: ../worker
    environment:
      HG_WORKER_REPOS_DIR: /data/repos
      BFF_GRAPHQL_URL: https://${BFF_TEST_DOMAIN}/graphql
      HG_WORKER_TOKEN: ${HG_WORKER_TOKEN}
    volumes:
      - /data/repos-test:/data/repos
    restart: unless-stopped

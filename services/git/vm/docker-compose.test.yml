# Deployed on the DO VM as: docker compose -p codehub-git-test -f docker-compose.test.yml --env-file .env.test up -d
services:
  git-app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../etc/gitconfig:/etc/gitconfig:ro
      - ../hooks:/opt/gitservice/hooks:ro
      - ./hook-config.test.env:/opt/gitservice/hook-config.env:ro
      - /data/git-repos-test:/data/repos
    restart: unless-stopped

  git-browse:
    build:
      context: ../browse
    environment:
      GIT_BROWSE_REPOS_DIR: /data/repos
    volumes:
      # Read-only — browsing should never mutate, unlike git-app/worker.
      - /data/git-repos-test:/data/repos:ro
    restart: unless-stopped

  git-proxy:
    image: nginx:alpine
    depends_on:
      - git-app
      - git-browse
    # Bare port, no TLS — same reasoning as the hg test stack's
    # hgweb-proxy (8001): no domain to issue a cert for. 8002 is the next
    # free port after hg-test's 8001.
    ports:
      - '8002:8002'
    environment:
      # Substituted into nginx-test.conf.template at container start — see
      # that file's header comment. The test BFF's Railway-generated domain.
      BFF_TEST_DOMAIN: ${BFF_TEST_DOMAIN}
    volumes:
      - ./nginx-test.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

  worker:
    build:
      context: ../worker
    environment:
      GIT_WORKER_REPOS_DIR: /data/repos
      BFF_GRAPHQL_URL: https://${BFF_TEST_DOMAIN}/graphql
      GIT_WORKER_TOKEN: ${GIT_WORKER_TOKEN}
    volumes:
      - /data/git-repos-test:/data/repos
    restart: unless-stopped

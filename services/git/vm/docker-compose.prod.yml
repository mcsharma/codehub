# Deployed on the DO VM as: docker compose -p codehub-git-prod -f docker-compose.prod.yml --env-file .env.prod up -d
# See ../README.md for the full picture (prod vs test, deploy.sh, worker/hook auth).
services:
  git-app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../etc/gitconfig:/etc/gitconfig:ro
      - ../hooks:/opt/gitservice/hooks:ro
      - ./hook-config.prod.env:/opt/gitservice/hook-config.env:ro
      - /data/git-repos-prod:/data/repos
    restart: unless-stopped

  git-browse:
    build:
      context: ../browse
    environment:
      GIT_BROWSE_REPOS_DIR: /data/repos
    volumes:
      # Read-only — browsing should never mutate, unlike git-app/worker.
      - /data/git-repos-prod:/data/repos:ro
    restart: unless-stopped

  git-proxy:
    image: nginx:alpine
    depends_on:
      - git-app
      - git-browse
    # Non-standard port, deliberately — hgweb-proxy already owns host
    # 80/443 on this VM. Git access is always CLI-driven, never browsed, so
    # a port in the remote URL costs nothing the way it would for a website.
    # See docs/plans/zesty-zooming-cupcake.md's "Key design decisions" #3.
    ports:
      - '8443:8443'
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  worker:
    build:
      context: ../worker
    environment:
      GIT_WORKER_REPOS_DIR: /data/repos
      BFF_GRAPHQL_URL: https://www.greensnippet.com/graphql
      GIT_WORKER_TOKEN: ${GIT_WORKER_TOKEN}
    volumes:
      - /data/git-repos-prod:/data/repos
    restart: unless-stopped

# Prod's git nginx — same auth_request/@auth_denied machinery as
# services/hg/vm/nginx-prod.conf, but on git.greensnippet.com at a
# non-standard port (8443) instead of 443, since hgweb-proxy already owns
# host 80/443 on this VM. See docs/plans/zesty-zooming-cupcake.md's "Key
# design decisions" #3 for why.
#
# TLS note: Certbot's default HTTP-01 challenge validates over port 80,
# which this server doesn't listen on — issuing/renewing
# git.greensnippet.com's cert needs either a DNS-01 challenge (recommended,
# needs no port open at all) or a one-off port-80 listener during
# issuance/renewal. Not automated here — see services/git/README.md.
server {
    server_name git.greensnippet.com;
    listen 8443 ssl;
    listen [::]:8443 ssl;

    ssl_certificate /etc/letsencrypt/live/git.greensnippet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.greensnippet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Commit/diff/directory browsing for git repos — see
    # docs/plans/zesty-zooming-cupcake.md. A real HTTP server (proxy_pass),
    # not fastcgi like git-http-backend below. Ordered first since it's the
    # more specific prefix; matched before falling through to the
    # smart-HTTP location for the same /owner/repo namespace.
    location ~ ^/[^/]+/[^/]+/_browse/ {
        auth_request /internal/auth-check;
        error_page 401 = @auth_denied;

        proxy_pass http://git-browse:9100;
        proxy_set_header Host $host;
    }

    location ~ ^/[^/]+/[^/]+/(HEAD|info/refs|objects/.*|git-upload-pack|git-receive-pack)$ {
        auth_request /internal/auth-check;
        error_page 401 = @auth_denied;
        auth_request_set $codehub_user $upstream_http_x_codehub_user;

        include fastcgi_params;
        fastcgi_pass git-app:9000;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /data/repos;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REMOTE_USER $codehub_user;
    }

    location = /internal/auth-check {
        internal;
        proxy_pass https://www.greensnippet.com/internal/auth-check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @auth_denied {
        add_header WWW-Authenticate 'Basic realm="git access"' always;
        return 401;
    }
}

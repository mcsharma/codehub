# Local dev now points at the DO VM's `test` stack for everything
# hg/Postgres-related (see services/hg/README.md) — there's nothing left to
# run locally except the BFF itself, containerized the same way prod is
# (see bff/Dockerfile), so the two environments run the exact same image.
#
# `.env` (bff/.env, copied from bff/.env.example) needs DATABASE_URL
# pointed at the codehub-bff-test Railway Postgres and HG_WEB_BASE pointed
# at the VM test stack's hgweb-proxy.
services:
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    # Overrides the image's default `node dist/index.js` (built once at
    # image-build time) with tsx watch against the bind-mounted source, so
    # local edits still hot-reload instead of needing a rebuild per change.
    command: ['npx', 'tsx', 'watch', 'src/index.ts']
    working_dir: /app/bff
    ports:
      - '4000:4000'
    env_file:
      - bff/.env
    volumes:
      - ./bff/src:/app/bff/src:ro
      - ./bff/prisma:/app/bff/prisma:ro
